<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 12px; border-bottom: 1px solid #eee; }
    /* VIOLATION: color-contrast - discount text too light */
    .discount { color: #b0b0b0; font-size: 12px; }
    .remove-btn { color: red; background: none; border: none; cursor: pointer; font-size: 18px; }
    .checkout-btn { background: #28a745; color: white; padding: 14px 28px; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<!-- VIOLATION: html-has-lang - missing lang attribute on <html> -->
<body>
  <!-- VIOLATION: landmark - no main landmark -->
  <h1>Your Cart</h1>
  <!-- VIOLATION: table structure - missing th scope attributes -->
  <table>
    <tr>
      <th>Item</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Action</th>
    </tr>
    <tr>
      <td>
        <!-- VIOLATION: image-alt missing -->
        <img src="shoe-red-thumb.jpg" width="60" height="60">
        Running Shoe - Red
      </td>
      <td>
        <!-- VIOLATION: label - no label for quantity input -->
        <input type="number" value="1" min="1" max="10" style="width: 50px;">
      </td>
      <td>$89.99 <span class="discount">Save $10.00</span></td>
      <td>
        <!-- VIOLATION: button-name - no accessible name -->
        <button class="remove-btn">×</button>
      </td>
    </tr>
    <tr>
      <td>
        <img src="shoe-blue-thumb.jpg" width="60" height="60">
        Running Shoe - Blue
      </td>
      <td>
        <input type="number" value="2" min="1" max="10" style="width: 50px;">
      </td>
      <td>$179.98 <span class="discount">Save $20.00</span></td>
      <td>
        <button class="remove-btn">×</button>
      </td>
    </tr>
  </table>
  <br>
  <p><strong>Total: $269.97</strong></p>
  <button class="checkout-btn">Proceed to Checkout</button>
</body>
</html>
