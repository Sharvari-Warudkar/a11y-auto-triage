<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; }
    /* VIOLATION: color-contrast - error message too light */
    .error-msg { color: #ff9999; font-size: 12px; }
    /* VIOLATION: focus-visible - outline suppressed on all inputs */
    input:focus, select:focus { outline: none; }
    .place-order { background: #0066cc; color: white; padding: 14px 28px; border: none; font-size: 16px; cursor: pointer; }
    .section-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <form>
      <!-- VIOLATION: heading hierarchy - skips from h1 to using styled divs -->
      <div class="section-title">Shipping Information</div>
      <div class="form-group">
        <!-- VIOLATION: label - no label element, just placeholder -->
        <input type="text" placeholder="Full Name" id="name">
      </div>
      <div class="form-group">
        <input type="email" placeholder="Email Address" id="email">
      </div>
      <div class="form-group">
        <input type="text" placeholder="Street Address" id="address">
      </div>
      <div class="form-group">
        <input type="text" placeholder="City" id="city">
      </div>
      <div class="form-group">
        <!-- VIOLATION: label missing on select -->
        <select id="state">
          <option value="">Select State</option>
          <option value="CA">California</option>
          <option value="NY">New York</option>
          <option value="TX">Texas</option>
        </select>
      </div>
      <div class="form-group">
        <input type="text" placeholder="ZIP Code" id="zip">
      </div>

      <div class="section-title">Payment</div>
      <div class="form-group">
        <input type="text" placeholder="Card Number" id="card" autocomplete="cc-number">
      </div>
      <div class="form-group">
        <input type="text" placeholder="MM/YY" id="expiry" autocomplete="cc-exp">
      </div>
      <div class="form-group">
        <input type="text" placeholder="CVV" id="cvv" autocomplete="cc-csc">
      </div>
      <!-- VIOLATION: error message not associated with input -->
      <p class="error-msg" id="card-error">Please enter a valid card number</p>

      <button type="submit" class="place-order">Place Order</button>
    </form>
  </main>
</body>
</html>
