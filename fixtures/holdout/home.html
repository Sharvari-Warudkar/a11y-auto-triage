<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Home</title>
  <style>
    body { font-family: Verdana, sans-serif; margin: 0; background: #ffffff; }
    header { background: #12355b; color: #ffffff; padding: 16px 24px; }
    .promo { background: #ffe9a8; color: #d9c27a; padding: 10px 24px; font-size: 14px; }
    .hero { padding: 24px; }
    .icon-link { display: inline-block; width: 32px; height: 32px; background: #12355b; }
    form.newsletter { padding: 24px; }
    form.newsletter input { padding: 8px; width: 260px; }
  </style>
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    <a href="/cart" class="icon-link"></a>
  </header>
  <div class="promo">Free shipping on orders over $50 this week only</div>
  <main class="hero">
    <img src="hero-summer-sale.jpg" width="600" height="200">
    <h2>Summer Sale</h2>
    <p>Up to 40% off selected footwear and accessories.</p>
  </main>
  <form class="newsletter">
    <input type="email" placeholder="Your email address" id="news-email">
    <button type="submit">Subscribe</button>
  </form>
</body>
</html>
