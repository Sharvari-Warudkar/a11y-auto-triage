<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - ShopEasy</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #f4f6f8; margin: 0; padding: 40px; }
    .card { background: #ffffff; max-width: 380px; margin: 0 auto; padding: 24px; border-radius: 6px; }
    input { display: block; width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
    .error { color: #e8a0a0; font-size: 13px; }
    .eye { background: #eeeeee; border: 1px solid #cccccc; width: 36px; height: 36px; cursor: pointer; }
    .primary { background: #0b5ed7; color: #ffffff; padding: 10px 20px; border: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <form>
      <input type="email" placeholder="Email" id="login-email">
      <input type="password" placeholder="Password" id="login-password">
      <button type="button" class="eye"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"></circle></svg></button>
      <p class="error">Incorrect email or password</p>
      <button type="submit" class="primary">Sign in</button>
    </form>
  </main>
</body>
</html>
